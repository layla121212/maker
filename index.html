<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d5b">
  <meta name="description" content="매일 할 일을 적고 체크하는 간단한 앱">
  <title>오늘의 할 일</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="할 일">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="date-bar">
      <button id="prev-day" class="nav-btn" aria-label="이전 날">◀</button>
      <div class="date-box">
        <h1 id="date-title">오늘</h1>
        <button id="go-today" class="today-btn" hidden>오늘로 가기</button>
      </div>
      <button id="next-day" class="nav-btn" aria-label="다음 날">▶</button>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="new-todo" type="text" placeholder="할 일을 적어주세요" aria-label="새 할 일" maxlength="200">
      <button type="submit" class="add-btn">추가</button>
    </form>

    <p id="progress" class="progress"></p>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty" class="empty">아직 할 일이 없어요.<br>위 칸에 적고 <b>추가</b>를 눌러보세요!</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
